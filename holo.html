<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全息粒子 3D 模型 - 协作上传版</title>
    <style>
        body {
            margin: 0; padding: 0; overflow: hidden; background-color: #030305;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: none;
        }
        #canvas-container { width: 100vw; height: 100vh; }

        /* 左侧 UI 控制面板 */
        #ui-overlay {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            color: #fff; pointer-events: none;
        }
        .status-card {
            background: rgba(15, 15, 20, 0.7); backdrop-filter: blur(12px);
            padding: 20px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 15px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            pointer-events: auto; width: 240px;
        }
        .status-item { margin: 8px 0; font-size: 14px; display: flex; justify-content: space-between; }
        .status-value { color: #ffaa00; font-weight: bold; }

        .gallery-title { font-size: 14px; color: #ccc; margin-top: 15px; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px;}
        .preset-container {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 5px;
        }
        .preset-img {
            width: 100%; aspect-ratio: 1; border-radius: 8px;
            border: 2px solid transparent; cursor: pointer;
            object-fit: cover; transition: all 0.3s ease; opacity: 0.6;
            background: #222;
        }
        .preset-img:hover { opacity: 1; transform: scale(1.05); }
        .preset-img.active { opacity: 1; border-color: #ffaa00; box-shadow: 0 0 10px rgba(255, 170, 0, 0.5); }

        /* 操作按钮组 */
        .action-group {
            position: absolute; top: 20px; right: 20px; z-index: 20;
            display: flex; flex-direction: column; gap: 10px;
        }
        .btn {
            background: rgba(15, 15, 20, 0.7); color: white; border: 1px solid rgba(255, 170, 0, 0.5);
            padding: 10px 18px; border-radius: 50px; font-size: 14px; cursor: pointer;
            backdrop-filter: blur(10px); transition: all 0.3s ease; display: flex; align-items: center; justify-content: center;
        }
        .btn.primary { background: linear-gradient(135deg, #ff8800, #ffaa00); border: none; box-shadow: 0 4px 15px rgba(255, 170, 0, 0.4); }
        .btn:hover { transform: scale(1.05); }
        #imageUpload { display: none; }

        #video-container {
            position: absolute; bottom: 20px; right: 20px; width: 160px; height: 120px;
            border-radius: 12px; overflow: hidden; border: 2px solid rgba(255, 170, 0, 0.5);
            transform: scaleX(-1); background: #111; box-shadow: 0 4px 15px rgba(255, 170, 0, 0.2); z-index: 10;
        }
        #webcam-video { width: 100%; height: 100%; object-fit: cover; }

        /* 模态框样式 */
        .loader {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #ffaa00; text-align: center; z-index: 1000; background: rgba(0,0,0,0.85);
            padding: 30px; border-radius: 20px; backdrop-filter: blur(5px); display: none;
        }
        .loader-spinner {
            border: 4px solid rgba(255, 170, 0, 0.1); border-left-color: #ffaa00;
            border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); z-index: 999;
            justify-content: center; align-items: center; flex-direction: column;
        }
        .qr-card { background: white; padding: 30px; border-radius: 24px; text-align: center; color: #333; max-width: 320px; }
        .qr-card h3 { margin-top: 0; color: #111; }
        .confirm-card { background: #1a1a1e; color: white; padding: 25px; border-radius: 20px; text-align: center; border: 1px solid #333; max-width: 300px; }
        
        .modal-btns { display: flex; gap: 10px; margin-top: 20px; justify-content: center; }
        .modal-btn { padding: 10px 20px; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; }
        .modal-btn.cancel { background: #333; color: #ccc; }
        .modal-btn.upload { background: #ffaa00; color: #000; }

        #mobile-upload-ui { display: none; padding: 20px; color: white; text-align: center; }

        @media (max-width: 768px) {
            #ui-overlay { transform: scale(0.85); transform-origin: top left; }
            .action-group { flex-direction: row; top: auto; bottom: 150px; right: 20px; flex-wrap: wrap; justify-content: flex-end;}
        }
    </style>
</head>
<body>

    <div id="loader" class="loader"><div class="loader-spinner"></div><p id="loader-text">正在处理...</p></div>

    <!-- 扫码上传模态框 -->
    <div class="modal-overlay" id="qrModal">
        <div class="qr-card">
            <h3>📱 扫码上传图片</h3>
            <div id="qrcode" style="margin: 20px auto; display: flex; justify-content: center;"></div>
            <p style="font-size: 14px; color: #666;">扫描二维码在手机端上传照片<br>仅限 3 张槽位</p>
            <button class="modal-btn cancel" style="width:100%" onclick="closeModal('qrModal')">取消</button>
        </div>
    </div>

    <!-- 覆盖提示模态框 -->
    <div class="modal-overlay" id="confirmModal">
        <div class="confirm-card">
            <h3 style="color: #ffaa00">⚠️ 槽位已满</h3>
            <p>若继续上传将覆盖之前上传的图片。是否继续？</p>
            <div class="modal-btns">
                <button class="modal-btn cancel" onclick="closeModal('confirmModal')">取消 Cancel</button>
                <button class="modal-btn upload" id="confirmUploadBtn">上传 Upload</button>
            </div>
        </div>
    </div>

    <!-- 手机端上传专用界面 (隐藏，通过路由显示) -->
    <div id="mobile-upload-ui">
        <h2 style="color:#ffaa00">全息上传终端</h2>
        <p>请选择一张照片上传到大屏幕</p>
        <button class="btn primary" style="width:200px; margin: 20px auto;" onclick="document.getElementById('mobileFileInput').click()">选择图片</button>
        <input type="file" id="mobileFileInput" accept="image/*" style="display:none">
        <div id="uploadStatus" style="margin-top:20px; color:#aaa"></div>
    </div>

    <!-- 主界面 UI -->
    <div id="main-ui">
        <div class="action-group">
            <button class="btn" id="musicBtn" onclick="toggleMusic()">🎵 播放音乐</button>
            <button class="btn primary" onclick="showQRModal()">📸 扫码上传图片</button>
            <button class="btn" onclick="document.getElementById('imageUpload').click()">📁 本地上传</button>
            <input type="file" id="imageUpload" accept="image/png, image/jpeg, image/jpg">
        </div>

        <div id="ui-overlay">
            <div class="status-card">
                <h2 style="margin: 0 0 15px 0; color: #ffaa00; font-size: 18px;">全息控制器</h2>
                <div class="status-item"><span>手势:</span> <span class="status-value" id="gesture-type">等待中...</span></div>
                <div class="status-item"><span>距离:</span> <span class="status-value" id="zoom-speed">0</span></div>
                <div class="status-item"><span>角度:</span> <span class="status-value" id="rotation-val">0°</span></div>
                
                <div>
                    <div class="gallery-title">✨ 核心图库</div>
                    <div class="preset-container" id="preset-gallery"></div>
                    
                    <div class="gallery-title">👤 用户上传 (3槽位)</div>
                    <div class="preset-container" id="user-gallery">
                        <div class="preset-img" style="display:flex;align-items:center;justify-content:center;font-size:20px;color:#444">1</div>
                        <div class="preset-img" style="display:flex;align-items:center;justify-content:center;font-size:20px;color:#444">2</div>
                        <div class="preset-img" style="display:flex;align-items:center;justify-content:center;font-size:20px;color:#444">3</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="video-container"><video id="webcam-video" autoplay playsinline></video></div>
        <div id="canvas-container"></div>
    </div>

    <audio id="bgm" loop><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg"></audio>

    <!-- 依赖库 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, query, orderBy } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

        // --- Firebase 配置 ---
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'holo-app-v2';

        // --- 全局状态 ---
        const PRESETS = [
            { id: 'cat', url: 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80' },
            { id: 'statue', url: 'https://images.unsplash.com/photo-1618666012174-83b441c0bc76?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80' },
            { id: 'neon', url: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80' },
            { id: 'flower', url: 'https://images.unsplash.com/photo-1582794543139-8ac9cb0f7b11?q=80&w=627&auto=format&fit=crop&ixlib=rb-4.1.0' }
        ];

        let userUploads = []; // 存储用户上传的图片对象 {id, url, timestamp}
        let scene, camera, renderer, mainGroup, modelParticles, ring1, ring2, videoElement, hands;
        let currentDistance = 60, targetRotation = 0, currentRotation = 0;
        let isPlaying = false;
        let currentUser = null;

        const isMobile = window.innerWidth < 768;
        const MODEL_PARTICLES = isMobile ? 50000 : 100000; 
        const RING_PARTICLES = isMobile ? 2000 : 4000;    
        const MIN_CAMERA_DIST = 20; const MAX_CAMERA_DIST = 120;

        // --- 初始化入口 ---
        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const mode = urlParams.get('mode');

            // 匿名登录以访问 Firestore
            await signInAnonymously(auth);
            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                if (mode === 'upload') {
                    startMobileUploadMode();
                } else {
                    startDesktopMode();
                }
            });
        }

        // --- 桌面模式逻辑 ---
        async function startDesktopMode() {
            document.getElementById('loader').style.display = 'block';
            document.getElementById('loader-text').innerText = "初始化 3D 全息系统...";

            initThreeScene();
            initGalleryUI();
            listenToUploads(); // 监听云端上传

            await build3DModelFromImage(PRESETS[0].url);
            
            setupMediaPipe();
            setupLocalUpload();
            animate();
            document.getElementById('loader').style.display = 'none';
        }

        function initThreeScene() {
            scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x030305, 0.005);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            mainGroup = new THREE.Group(); scene.add(mainGroup);

            createRings();
            createBackgroundStars();
        }

        // 监听 Firestore 中的上传数据
        function listenToUploads() {
            const q = collection(db, 'artifacts', appId, 'public', 'data', 'uploads');
            onSnapshot(q, (snapshot) => {
                const uploads = [];
                snapshot.forEach(doc => uploads.push({ id: doc.id, ...doc.data() }));
                // 按时间排序（手动模拟，避免复合查询索引问题）
                userUploads = uploads.sort((a, b) => a.timestamp - b.timestamp).slice(-3);
                updateUserGalleryUI();
            }, (err) => console.error("Firestore Listen Error:", err));
        }

        function updateUserGalleryUI() {
            const container = document.getElementById('user-gallery');
            container.innerHTML = '';
            
            for (let i = 0; i < 3; i++) {
                const data = userUploads[i];
                if (data) {
                    const img = document.createElement('img');
                    img.src = data.url;
                    img.className = 'preset-img';
                    img.onclick = () => selectImage(img, data.url);
                    container.appendChild(img);
                } else {
                    const empty = document.createElement('div');
                    empty.className = 'preset-img';
                    empty.style = "display:flex;align-items:center;justify-content:center;font-size:20px;color:#444";
                    empty.innerText = i + 1;
                    container.appendChild(empty);
                }
            }
        }

        function selectImage(el, url) {
            document.querySelectorAll('.preset-img').forEach(img => img.classList.remove('active'));
            el.classList.add('active');
            build3DModelFromImage(url);
        }

        // --- 手机上传模式逻辑 ---
        function startMobileUploadMode() {
            document.getElementById('main-ui').style.display = 'none';
            document.getElementById('mobile-upload-ui').style.display = 'block';
            document.body.style.overflow = 'auto';
            document.body.style.background = '#0a0a0c';

            const fileInput = document.getElementById('mobileFileInput');
            fileInput.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                // 检查槽位
                if (userUploads.length >= 3) {
                    showConfirmModal(() => performUpload(file));
                } else {
                    performUpload(file);
                }
            };
        }

        async function performUpload(file) {
            const status = document.getElementById('uploadStatus');
            status.innerText = "正在转换图片...";
            closeModal('confirmModal');

            try {
                const base64 = await fileToBase64(file);
                const slotId = userUploads.length >= 3 ? userUploads[0].id : `slot_${Date.now()}`;
                
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'uploads', slotId), {
                    url: base64,
                    timestamp: Date.now()
                });

                status.innerText = "✅ 上传成功！查看大屏幕";
                setTimeout(() => status.innerText = "", 3000);
            } catch (err) {
                status.innerText = "❌ 上传失败，请重试";
                console.error(err);
            }
        }

        // --- 通用工具函数 ---
        window.showQRModal = function() {
            const m = document.getElementById('qrModal');
            const q = document.getElementById('qrcode');
            q.innerHTML = '';
            const uploadUrl = `${window.location.origin}${window.location.pathname}?mode=upload`;
            new QRCode(q, { text: uploadUrl, width: 180, height: 180 });
            m.style.display = 'flex';
        };

        window.closeModal = (id) => document.getElementById(id).style.display = 'none';

        function showConfirmModal(onConfirm) {
            const m = document.getElementById('confirmModal');
            m.style.display = 'flex';
            document.getElementById('confirmUploadBtn').onclick = onConfirm;
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // --- 核心业务逻辑 (保留自原始版本) ---
        
        function initGalleryUI() {
            const container = document.getElementById('preset-gallery');
            PRESETS.forEach((preset, index) => {
                const img = document.createElement('img');
                img.src = preset.url;
                img.className = index === 0 ? 'preset-img active' : 'preset-img';
                img.onclick = () => selectImage(img, preset.url);
                container.appendChild(img);
            });
        }

        async function build3DModelFromImage(imageUrl) {
            document.getElementById('loader').style.display = 'block';
            document.getElementById('loader-text').innerText = "解析全息点云...";
            
            return new Promise((resolve) => {
                const loader = new THREE.ImageLoader(); loader.setCrossOrigin('anonymous');
                loader.load(imageUrl, (image) => {
                    if (modelParticles) { 
                        mainGroup.remove(modelParticles); 
                        modelParticles.geometry.dispose(); 
                        modelParticles.material.dispose(); 
                    }
                    const canvas = document.createElement('canvas'); 
                    const ctx = canvas.getContext('2d', { willReadFrequently: true });
                    const aspect = image.width / image.height;
                    let imgW = 200, imgH = 200;
                    if (aspect > 1) imgH = Math.floor(200 / aspect); else imgW = Math.floor(200 * aspect);
                    canvas.width = imgW; canvas.height = imgH; 
                    ctx.drawImage(image, 0, 0, imgW, imgH);
                    const imgData = ctx.getImageData(0, 0, imgW, imgH).data;

                    const positions = []; const colors = []; const scale = 0.18;
                    for (let i = 0; i < MODEL_PARTICLES; i++) {
                        const x = Math.floor(Math.random() * imgW); 
                        const y = Math.floor(Math.random() * imgH);
                        const pixelIdx = (y * imgW + x) * 4;
                        const r = imgData[pixelIdx]/255, g = imgData[pixelIdx+1]/255, b = imgData[pixelIdx+2]/255, a = imgData[pixelIdx+3]/255;
                        if (r > 0.95 && g > 0.95 && b > 0.95) continue; 
                        if (a < 0.2) continue;
                        
                        const px = (x - imgW/2) * scale + (Math.random()-0.5)*0.1;
                        const py = (imgH/2 - y) * scale + (Math.random()-0.5)*0.1;
                        // 深度由亮度决定
                        const brightness = (0.299*r + 0.587*g + 0.114*b);
                        const pz = (brightness * 10) - 5 + (Math.random()-0.5)*1.2;

                        positions.push(px, py, pz); 
                        colors.push(r*1.2, g*1.2, b*1.5);
                    }
                    const geo = new THREE.BufferGeometry();
                    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
                    const mat = new THREE.PointsMaterial({ 
                        size: isMobile ? 0.25 : 0.15, 
                        vertexColors: true, 
                        transparent: true, 
                        opacity: 0.8, 
                        blending: THREE.AdditiveBlending, 
                        depthWrite: false 
                    });
                    modelParticles = new THREE.Points(geo, mat); 
                    mainGroup.add(modelParticles);
                    document.getElementById('loader').style.display = 'none';
                    resolve();
                });
            });
        }

        function createRings() {
            function create(inner, outer, count, hex) {
                const geo = new THREE.BufferGeometry(); const pos = [];
                for (let i=0; i<count; i++) {
                    const a = Math.random()*Math.PI*2, r = inner+Math.random()*(outer-inner);
                    pos.push(Math.cos(a)*r, (Math.random()-0.5)*2, Math.sin(a)*r);
                }
                geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
                return new THREE.Points(geo, new THREE.PointsMaterial({size:0.12, color:hex, transparent:true, opacity:0.3, blending:THREE.AdditiveBlending}));
            }
            ring1 = create(22, 26, RING_PARTICLES, 0xffccaa); 
            ring2 = create(28, 34, RING_PARTICLES/2, 0x00aaff); 
            ring1.rotation.x = Math.PI/2.5; ring2.rotation.x = -Math.PI/3; 
            mainGroup.add(ring1, ring2);
        }

        function createBackgroundStars() {
            const geo = new THREE.BufferGeometry(); const pos = [];
            for(let i=0; i<1500; i++) pos.push((Math.random()-0.5)*500, (Math.random()-0.5)*500, (Math.random()-0.5)*500);
            geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.3, color: 0x444455 })));
        }

        function setupMediaPipe() {
            videoElement = document.getElementById('webcam-video');
            hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
            hands.onResults((results) => {
                const elType = document.getElementById('gesture-type');
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const lm = results.multiHandLandmarks[0];
                    const isFist = [8,12,16,20].filter(f => lm[f].y > lm[f-2].y).length >= 3;
                    targetRotation = Math.atan2(lm[9].y - lm[0].y, lm[9].x - lm[0].x) + Math.PI/2;
                    
                    if(isFist) { 
                        elType.innerText = "✊ 缩放中"; 
                        elType.style.color = "#f44"; 
                        currentDistance += Math.pow(currentDistance*0.05, 1.2)*0.15; 
                    } else { 
                        elType.innerText = "🖐️ 观察中"; 
                        elType.style.color = "#4f4"; 
                        currentDistance -= (currentDistance - MIN_CAMERA_DIST)*0.08; 
                    }
                    
                    currentDistance = Math.max(MIN_CAMERA_DIST, Math.min(MAX_CAMERA_DIST, currentDistance));
                    document.getElementById('zoom-speed').innerText = currentDistance.toFixed(1) + " M";
                    document.getElementById('rotation-val').innerText = Math.round(targetRotation*180/Math.PI) + "°";
                } else {
                    elType.innerText = "未检测"; elType.style.color = "#fa0";
                }
            });
            new Camera(videoElement, { onFrame: async () => await hands.send({ image: videoElement }), width: 640, height: 480 })
                .start().catch(()=>console.log("Camera access denied or unavailable"));
        }

        function setupLocalUpload() {
            document.getElementById('imageUpload').addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (file) {
                    const base64 = await fileToBase64(file);
                    document.querySelectorAll('.preset-img').forEach(el => el.classList.remove('active'));
                    build3DModelFromImage(base64);
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            if (mainGroup) mainGroup.rotation.y += 0.0008; 
            if (ring1) { ring1.rotation.z += 0.003; ring2.rotation.z -= 0.002; }
            currentRotation += (targetRotation - currentRotation) * 0.1;
            camera.position.set(Math.sin(currentRotation)*currentDistance, currentDistance*0.12, Math.cos(currentRotation)*currentDistance);
            camera.lookAt(0,0,0); 
            renderer.render(scene, camera);
        }

        window.toggleMusic = function() {
            const bgm = document.getElementById('bgm');
            const btn = document.getElementById('musicBtn');
            if (isPlaying) { bgm.pause(); btn.innerText = "🎵 播放音乐"; btn.style.background = "rgba(15, 15, 20, 0.7)"; } 
            else { bgm.play(); btn.innerText = "⏸️ 暂停音乐"; btn.style.background = "rgba(255, 170, 0, 0.3)"; }
            isPlaying = !isPlaying;
        };

        window.addEventListener('resize', () => { 
            camera.aspect = window.innerWidth/window.innerHeight; 
            camera.updateProjectionMatrix(); 
            renderer.setSize(window.innerWidth, window.innerHeight); 
        });

        init();
    </script>
</body>
</html>
