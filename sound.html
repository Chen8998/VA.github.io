<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Interactive 3D Particles</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Inter', sans-serif; }
        canvas { display: block; }

        /* --- Back to Portal Button --- */
        .top-right-container {
            position: absolute;
            top: 25px;
            right: 25px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            pointer-events: auto;
        }
        .back-button {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            letter-spacing: 1px;
        }
        .back-button:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #fff;
            transform: translateX(-5px);
        }

        #instructions {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.7);
            text-align: center;
            pointer-events: none;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        #ui-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
        }
        input[type="file"] { display: none; }
        .btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 10px 24px;
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.2); border-color: #fff; }
        .btn.active { background: rgba(0, 255, 100, 0.2); border-color: #00ff64; }

        /* Offset the GUI so it doesn't cover the back button */
        .lil-gui.root { margin-top: 130px !important; }

        .lil-gui { 
            --background-color: rgba(255, 255, 255, 0.95) !important;
            --text-color: #111 !important;
            --title-background-color: #eee !important;
            --widget-color: #ddd !important;
        }

        /* --- Scan Upload Modal / Mobile Sender Page (added) --- */
        .modal-overlay{
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(10px);
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
        }
        .qr-card{
            background: rgba(255,255,255,0.95);
            color: #111;
            border-radius: 18px;
            padding: 22px 20px;
            width: min(360px, 100%);
            text-align: center;
            box-shadow: 0 18px 60px rgba(0,0,0,0.55);
            position: relative;
        }
        .qr-close-x{
            position: absolute;
            top: 10px;
            right: 10px;
            width: 32px;
            height: 32px;
            border-radius: 16px;
            border: 1px solid rgba(0,0,0,0.08);
            background: rgba(0,0,0,0.04);
            color: rgba(0,0,0,0.65);
            cursor: pointer;
            font-size: 18px;
            line-height: 30px;
            padding: 0;
        }
        .qr-close-x:hover{ background: rgba(0,0,0,0.08); color: rgba(0,0,0,0.85); }
        .qr-title{ font-size: 14px; letter-spacing: 1px; margin: 0 0 8px 0; }
        .qr-sub{ font-size: 12px; color: rgba(0,0,0,0.6); line-height: 1.5; margin-bottom: 12px; }
        .qr-warning{
            display: none;
            margin-top: 10px;
            font-size: 12px;
            color: #b42318;
            background: #fee4e2;
            padding: 8px 10px;
            border-radius: 10px;
        }
        #uploadStatus{ font-size: 12px; color: rgba(0,0,0,0.7); min-height: 16px; }
        #mobileUploadPage{
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: radial-gradient(circle at top, rgba(0, 255, 100, 0.14), rgba(5,5,5,1) 60%);
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            color: #fff;
            text-align: center;
        }
        #mobileUploadCard{
            width: min(420px, 100%);
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 18px;
            padding: 20px;
            backdrop-filter: blur(14px);
        }
        #mobileUploadCard h2{ margin: 0 0 10px 0; font-size: 16px; letter-spacing: 1px; }
        #mobileUploadHint{ font-size: 12px; color: rgba(255,255,255,0.75); line-height: 1.55; margin-bottom: 14px; }
        #mobileUploadStatus{ font-size: 12px; margin-top: 12px; color: rgba(255,255,255,0.85); }
        #mobileImageUpload{ display: none; }
    </style>
</head>
<body>

    <div class="top-right-container">
        <a href="index.html" class="back-button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>返回首页</span>
        </a>
        <button class="btn" id="qrUploadBtn" onclick="showUploadQRModal()">扫码上传图片</button>
    </div>

    <!-- Scan Upload Modal (added) -->
    <div class="modal-overlay" id="qrUploadModal" onclick="closeUploadModal()">
        <div class="qr-card" onclick="event.stopPropagation()">
            <button class="qr-close-x" onclick="closeUploadModal()" aria-label="关闭">×</button>
            <h3 class="qr-title">扫码上传图片</h3>
            <div class="qr-sub">用手机扫码打开后，从手机本地选择图片上传到当前页面。</div>
            <div id="qrcodeUpload" style="margin: 10px auto 10px auto; display:flex; justify-content:center;"></div>
            <div id="uploadStatus">等待手机上传…</div>
            <div id="uploadWarning" class="qr-warning">⚠️ 需联网才可使用扫码上传（通过公共消息中转服务传输图片）。</div>
            <button class="btn" style="margin-top: 14px;" onclick="closeUploadModal()">关闭</button>
        </div>
    </div>

    <!-- Mobile Sender Page (added) -->
    <div id="mobileUploadPage">
        <div id="mobileUploadCard">
            <h2>上传图片到大屏</h2>
            <div id="mobileUploadHint">点击下方按钮选择一张手机本地图片，上传完成后大屏会自动更新 3D 粒子模型。</div>
            <button class="btn" style="width: 100%;" onclick="document.getElementById('mobileImageUpload').click()">选择图片并上传</button>
            <input type="file" id="mobileImageUpload" accept="image/*">
            <div id="mobileUploadStatus">等待选择图片…</div>
        </div>
    </div>

    <div id="instructions">Select Library • Upload Image • Enable Mic</div>
    
    <div id="ui-container">
        <label class="btn">
            UPLOAD IMAGE
            <input type="file" id="imageLoader" accept="image/*">
        </label>
        <button class="btn" id="micBtn">ENABLE MIC</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GUI } from 'lil-gui';

        // ==============================
        // 扫码上传图片（added；复用现有 createSystem/img 逻辑，不改动模型生成方式）
        // ==============================
        const MQTT_BROKER_URL = 'wss://broker.emqx.io:8084/mqtt';
        const MQTT_TOPIC_PREFIX = 'solo-holo-upload/v1/';
        // base64 分片大小：过大更易在移动网络下丢包/阻塞，导致接收端卡在 79% 等进度
        const UPLOAD_CHUNK_SIZE = 18000;
        let uploadReceiver = null;

        function genSessionId() {
            const bytes = new Uint8Array(12);
            crypto.getRandomValues(bytes);
            return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function buildUploadUrl(sessionId) {
            const url = new URL(window.location.href);
            url.searchParams.set('uploadSession', sessionId);
            url.searchParams.set('role', 'sender');
            return url.toString();
        }

        function setUploadStatus(text) {
            const el = document.getElementById('uploadStatus');
            if (el) el.innerText = text;
        }

        window.closeUploadModal = function() {
            document.getElementById('qrUploadModal').style.display = 'none';
            // 关闭弹窗时停止接收会话，避免后台占用连接与误收消息
            if (uploadReceiver && uploadReceiver.client) {
                try { uploadReceiver.client.end(true); } catch (e) {}
            }
            uploadReceiver = null;
        };

        window.showUploadQRModal = function() {
            const modal = document.getElementById('qrUploadModal');
            const q = document.getElementById('qrcodeUpload');
            q.innerHTML = '';
            setUploadStatus('等待手机上传…');
            document.getElementById('uploadWarning').style.display = 'none';

            const sessionId = genSessionId();
            const url = buildUploadUrl(sessionId);
            new QRCode(q, { text: url, width: 180, height: 180, colorDark: "#000", colorLight: "#fff" });
            modal.style.display = 'flex';

            startUploadReceiver(sessionId).catch((err) => {
                console.error(err);
                setUploadStatus('启动接收失败，请检查网络。');
                document.getElementById('uploadWarning').style.display = 'block';
            });
        };

        async function connectMqttClient(clientId) {
            if (!window.mqtt || !window.mqtt.connect) throw new Error('mqtt 库未加载');
            const client = window.mqtt.connect(MQTT_BROKER_URL, {
                clientId,
                clean: true,
                reconnectPeriod: 1500,
                connectTimeout: 8000
            });
            await new Promise((resolve, reject) => {
                const onConnect = () => { cleanup(); resolve(); };
                const onError = (e) => { cleanup(); reject(e); };
                const cleanup = () => {
                    client.off('connect', onConnect);
                    client.off('error', onError);
                };
                client.on('connect', onConnect);
                client.on('error', onError);
            });
            return client;
        }

        async function mqttPublish(client, topic, payload) {
            return new Promise((resolve, reject) => {
                // QoS 1 提升可靠性，避免分片丢失导致进度卡住
                client.publish(topic, payload, { qos: 1 }, (err) => err ? reject(err) : resolve());
            });
        }

        async function startUploadReceiver(sessionId) {
            if (uploadReceiver && uploadReceiver.client) {
                try { uploadReceiver.client.end(true); } catch (e) {}
            }

            setUploadStatus('正在建立连接…');
            const topic = MQTT_TOPIC_PREFIX + sessionId;
            const client = await connectMqttClient('sound-receiver-' + genSessionId());

            uploadReceiver = { sessionId, topic, client, meta: null, chunks: null, received: 0, lastMessageAt: 0 };
            client.subscribe(topic, { qos: 1 });

            client.on('message', async (_topic, message) => {
                if (_topic !== topic) return;
                let data;
                try { data = JSON.parse(message.toString()); } catch (e) { return; }
                if (!data || !data.t) return;

                if (data.t === 'meta') {
                    uploadReceiver.lastMessageAt = Date.now();
                    uploadReceiver.meta = data;
                    uploadReceiver.chunks = new Array(data.totalChunks || 0);
                    uploadReceiver.received = 0;
                    setUploadStatus(`已连接，开始接收：${data.name || '图片'}…`);

                    // 超时保护：长时间未收齐分片则提示重试，避免一直卡在某个百分比
                    const timeoutMs = 20000;
                    const mySessionId = uploadReceiver.sessionId;
                    setTimeout(() => {
                        if (!uploadReceiver || uploadReceiver.sessionId !== mySessionId) return;
                        if (!uploadReceiver.chunks || uploadReceiver.received === uploadReceiver.chunks.length) return;
                        const idle = Date.now() - (uploadReceiver.lastMessageAt || 0);
                        if (idle >= timeoutMs) {
                            setUploadStatus('接收超时，请在手机端重新上传。');
                            uploadReceiver.meta = null;
                            uploadReceiver.chunks = null;
                            uploadReceiver.received = 0;
                        }
                    }, timeoutMs + 200);
                    return;
                }

                if (data.t === 'chunk' && uploadReceiver.chunks) {
                    uploadReceiver.lastMessageAt = Date.now();
                    const idx = data.idx;
                    if (typeof idx !== 'number') return;
                    if (!uploadReceiver.chunks[idx]) {
                        uploadReceiver.chunks[idx] = data.data || '';
                        uploadReceiver.received += 1;
                        const total = uploadReceiver.chunks.length || 1;
                        const pct = Math.floor((uploadReceiver.received / total) * 100);
                        setUploadStatus(`接收中… ${pct}%`);
                    }

                    if (uploadReceiver.received === uploadReceiver.chunks.length) {
                        const dataUrl = uploadReceiver.chunks.join('');
                        setUploadStatus('接收完成，正在生成 3D 粒子模型…');
                        await handleIncomingImageDataUrl(dataUrl);
                        // 不在此处断开连接：允许同一次扫码会话连续上传多张图片
                        setUploadStatus('完成 ✅（可继续上传）');
                        uploadReceiver.meta = null;
                        uploadReceiver.chunks = null;
                        uploadReceiver.received = 0;
                    }
                }
            });

            setUploadStatus('等待手机上传…');
        }

        async function handleIncomingImageDataUrl(dataUrl) {
            const img = new Image();
            await new Promise((resolve) => {
                img.onload = () => resolve();
                img.src = dataUrl;
            });
            createSystem(img);
        }

        function renderMobileSenderUI(sessionId) {
            // 仅在手机端上传页面：隐藏原 UI
            const top = document.querySelector('.top-right-container');
            if (top) top.style.display = 'none';
            const inst = document.getElementById('instructions');
            if (inst) inst.style.display = 'none';
            const ui = document.getElementById('ui-container');
            if (ui) ui.style.display = 'none';

            const page = document.getElementById('mobileUploadPage');
            page.style.display = 'flex';

            const status = document.getElementById('mobileUploadStatus');
            const input = document.getElementById('mobileImageUpload');

            input.addEventListener('change', async (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;

                status.innerText = '读取图片…';
                const dataUrl = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (evt) => resolve(evt.target.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });

                status.innerText = '连接中…';
                const topic = MQTT_TOPIC_PREFIX + sessionId;
                let client;
                try {
                    client = await connectMqttClient('sound-sender-' + genSessionId());
                } catch (err) {
                    console.error(err);
                    status.innerText = '连接失败，请检查网络后重试。';
                    return;
                }

                try {
                    const totalChunks = Math.ceil(dataUrl.length / UPLOAD_CHUNK_SIZE);
                    await mqttPublish(client, topic, JSON.stringify({
                        t: 'meta',
                        name: file.name,
                        size: file.size,
                        mime: file.type,
                        totalChunks
                    }));

                    status.innerText = '上传中… 0%';
                    for (let i = 0; i < totalChunks; i++) {
                        const chunk = dataUrl.slice(i * UPLOAD_CHUNK_SIZE, (i + 1) * UPLOAD_CHUNK_SIZE);
                        await mqttPublish(client, topic, JSON.stringify({ t: 'chunk', idx: i, data: chunk }));
                        const pct = Math.floor(((i + 1) / totalChunks) * 100);
                        status.innerText = `上传中… ${pct}%`;
                        await new Promise(r => setTimeout(r, 5));
                    }

                    status.innerText = '上传完成 ✅ 你可以返回大屏查看效果。';
                    try {
                        // QoS1 下 publish 回调已拿到 PUBACK；弱网下给一点缓冲，避免最后分片未送达
                        await new Promise(r => setTimeout(r, 200));
                        client.end(false);
                    } catch (e) {}
                } catch (err) {
                    console.error(err);
                    status.innerText = '上传失败，请重试。';
                    try { client.end(false); } catch (e) {}
                } finally {
                    // 允许用户连续选择同一文件也能触发再次上传
                    input.value = '';
                }
            });
        }

        const state = {
            particleSize: 0.035,
            systemScale: 0.04,
            audioSensitivity: 1.8,
            expansionForce: 2.5,
            rotationSpeed: 0.002,
            autoRotate: true,
            tint: '#ffffff',
            panelWidth: 240,
            library: 'Vibrant Bird',
            presets: {
                'Vibrant Bird': 'https://images.unsplash.com/photo-1552728089-57bdde30fc3b?w=500&auto=format',
                'Neon Jellyfish': 'https://images.unsplash.com/photo-1544465544-1b71aee9dfa3?w=500&auto=format',
                'Cyberpunk City': 'https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=500&auto=format',
                'Abstract Art': 'https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=500&auto=format'
            }
        };

        let scene, camera, renderer, particles, geometry, material, gui;
        let mouseX = 0, mouseY = 0, targetRotationX = 0, targetRotationY = 0;
        let audioCtx, analyser, dataArray, currentVolume = 0, smoothedVolume = 0, isMicEnabled = false;

        // 若扫码链接带 role=sender，则显示手机端上传页；否则按原逻辑初始化
        (() => {
            const params = new URLSearchParams(window.location.search);
            const sessionId = params.get('uploadSession');
            const role = params.get('role');
            if (sessionId && role === 'sender') renderMobileSenderUI(sessionId);
            else init();
        })();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 6;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            gui = new GUI({ title: 'Visual Settings' });
            gui.width = state.panelWidth;
            
            const libFolder = gui.addFolder('Image Library');
            libFolder.add(state, 'library', Object.keys(state.presets)).name('Select Preset').onChange(name => {
                loadURL(state.presets[name]);
            });

            const colorFolder = gui.addFolder('Appearance');
            colorFolder.addColor(state, 'tint').name('Tint Color').onChange(v => { if(material) material.color.set(v); });
            colorFolder.add(state, 'particleSize', 0.01, 0.1).name('Particle Size');
            
            const audioFolder = gui.addFolder('Voice Reactivity');
            audioFolder.add(state, 'audioSensitivity', 0.1, 5.0).name('Scale Intensity');
            audioFolder.add(state, 'expansionForce', 0.1, 8.0).name('Explosion Force');
            
            const animFolder = gui.addFolder('Animation');
            animFolder.add(state, 'autoRotate').name('Auto Rotate');
            animFolder.add(state, 'rotationSpeed', 0, 0.01).name('Rotation Speed');

            document.getElementById('imageLoader').addEventListener('change', handleUpload);
            document.getElementById('micBtn').addEventListener('click', initAudio);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('resize', onResize);

            loadURL(state.presets[state.library]);
            animate();
        }

        function loadURL(url) {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = () => createSystem(img);
            img.src = url;
        }

        function handleUpload(e) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => createSystem(img);
                img.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        }

        function createSystem(img) {
            if (particles) { scene.remove(particles); geometry.dispose(); material.dispose(); }

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const res = 120; 
            canvas.width = res;
            canvas.height = Math.floor(res * (img.height / img.width));
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            const positions = [];
            const colors = [];
            const homes = [];

            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    const i = (y * canvas.width + x) * 4;
                    const brightness = (data[i] + data[i+1] + data[i+2]) / 765;
                    
                    if (data[i + 3] > 128) {
                        const hx = (x - canvas.width / 2) * state.systemScale;
                        const hy = -(y - canvas.height / 2) * state.systemScale;
                        const hz = brightness * 1.5;

                        homes.push(hx, hy, hz);
                        positions.push(hx, hy, hz);
                        colors.push(data[i]/255, data[i+1]/255, data[i+2]/255);
                    }
                }
            }

            geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('home', new THREE.Float32BufferAttribute(homes, 3));

            material = new THREE.PointsMaterial({
                size: state.particleSize,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

        async function initAudio() {
            if (isMicEnabled) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                const source = audioCtx.createMediaStreamSource(stream);
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                isMicEnabled = true;
                const btn = document.getElementById('micBtn');
                btn.innerText = 'MIC ACTIVE';
                btn.classList.add('active');
            } catch (err) { alert("Mic access needed for voice effects."); }
        }

        function onMouseMove(event) {
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
            targetRotationY = mouseX * 0.4;
            targetRotationX = -mouseY * 0.4;
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isMicEnabled && analyser) {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                currentVolume = (sum / dataArray.length) / 255;
            }
            smoothedVolume += (currentVolume - smoothedVolume) * 0.12;

            if (particles) {
                material.size = state.particleSize;

                if (state.autoRotate) particles.rotation.y += state.rotationSpeed;
                particles.rotation.y += (targetRotationY - particles.rotation.y) * 0.05;
                particles.rotation.x += (targetRotationX - particles.rotation.x) * 0.05;

                const audioScale = 1 + (smoothedVolume * state.audioSensitivity);
                particles.scale.set(audioScale, audioScale, audioScale);

                const posAttr = geometry.attributes.position;
                const homeAttr = geometry.attributes.home;
                const expandAmt = smoothedVolume * state.expansionForce;

                for (let i = 0; i < posAttr.count; i++) {
                    const hx = homeAttr.getX(i);
                    const hy = homeAttr.getY(i);
                    const hz = homeAttr.getZ(i);

                    posAttr.setXYZ(i, 
                        hx * (1 + expandAmt), 
                        hy * (1 + expandAmt), 
                        hz + (expandAmt * 2)
                    );
                }
                posAttr.needsUpdate = true;
            }
            renderer.render(scene, camera);
        }
    </script>
